name: EcoPackAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real PostgreSQL for the database and API integration tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecopack_user
          POSTGRES_PASSWORD: ecopack_pass
          POSTGRES_DB: ecopackai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecopack_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environments/requirements*.txt

      - name: Install dependencies
        run: pip install -r environments/requirements.txt pytest-cov==5.0.0 playwright==1.63.0 pypdf==5.0.1

      - name: Install browsers for the end-to-end tests
        run: python -m playwright install --with-deps chromium firefox

      - name: JavaScript unit tests
        run: node --test tests/frontend/predict.test.js tests/frontend/charts.test.js tests/frontend/recommendation_table.test.js

      # Fail only on real errors (syntax errors, undefined names);
      # style warnings are reported but do not break the build.
      - name: Lint with flake8
        run: |
          flake8 scripts ml backend dashboard src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 scripts ml backend dashboard src tests --count --exit-zero --max-line-length=120 --statistics

      # Tests read data/ with relative paths, so run from the repo root.
      - name: Tests on SQLite
        run: pytest tests -q

      - name: Tests on PostgreSQL, with coverage (includes end-to-end UI tests)
        env:
          TEST_DATABASE_URL: postgresql://ecopack_user:ecopack_pass@localhost:5432/ecopackai_test
        run: pytest tests -v --cov=backend --cov=src --cov-report=term-missing --junitxml=test-results.xml

      - name: Keep failure screenshots, traces and the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            tests/e2e/artifacts/
          if-no-files-found: ignore
