<text x="360" y="97" font-size="15" text-anchor="middle" font-weight="bold" fill="#2d3833">Product form</text>
<text x="360" y="138" font-size="12" text-anchor="middle" fill="#5d6b64">predict.html</text>
<line x1="455" y1="105" x2="497" y2="105" stroke="#3d4a44" stroke-width="2" marker-end="url(#arrow)"/>
