<text x="595" y="138" font-size="12" text-anchor="middle" fill="#5d6b64">predict.js</text>
<line x1="690" y1="105" x2="732" y2="105" stroke="#3d4a44" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="735" y="60" width="190" height="90" rx="8" fill="#eef1f0" stroke="#7d8c85" stroke-width="1.5"/>
<text x="830" y="97" font-size="15" text-anchor="middle" font-weight="bold" fill="#2d3833">POST /recommend</text>
<text x="830" y="138" font-size="12" text-anchor="middle" fill="#5d6b64">Flask API</text>
<line x1="925" y1="105" x2="967" y2="105" stroke="#3d4a44" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="970" y="60" width="190" height="90" rx="8" fill="#dfe7e2" stroke="#7d8c85" stroke-width="1.5"/>
<text x="1065" y="97" font-size="15" text-anchor="middle" font-weight="bold" fill="#2d3833">Results</text>
<text x="1065" y="138" font-size="12" text-anchor="middle" fill="#5d6b64">results.html</text>
<path d="M 595 150 C 595 200, 385 200, 380 158" fill="none" stroke="#a94442" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
<text x="488" y="218" font-size="13" text-anchor="middle" fill="#a94442">invalid: errors shown, no API call</text>
